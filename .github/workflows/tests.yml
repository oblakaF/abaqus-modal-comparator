name: Python tests

# ABM-AUD-2. What a green run means: every group below ran to unittest's own closing lines and passed.
#   linux / full suite ........ portable pure-Python tests, the legacy (non-Qt) program's tests and the PySide6 tests
#                               offscreen, in one process as before. Tests of the Win32 supervision are reported as
#                               SKIPPED_WINDOWS_ONLY here; a skip is counted as a skip, never as a pass.
#   linux / Qt stage .......... the NEW-GUI.1 Qt tests offscreen, none skipped.
#   linux / M11 R6.5 .......... the research synthetic tests (no real data).
#   windows-supervisor ........ the Win32 Job Object supervision natively: no skip is accepted there.
# The Linux job runs on Python 3.11 (as before) and on Python 3.14 (the interpreter the Windows program is used with).
# Every group is summarised by tests/ci_summary.py from its own log: a log without the closing lines (a native crash, a
# kill, a timeout) is DID_NOT_FINISH, a failure. Logs are uploaded even when a group fails.

on:
  push:
  pull_request:

jobs:
  test:
    name: linux (Python ${{ matrix.python }}, offscreen Qt)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      NEW_GUI_REQUIRE_QT: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Install the new interface dependency (PySide6, offscreen Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install -r requirements-new-gui.txt
          python -m pip freeze | tee installed-packages.txt
      - name: Guard - Signal.emit() keeps the reference counts of True and False
        # ABM-AUD-2: PySide6 6.12.0 for Linux on Python 3.11 lost one reference to True per emit; the full suite then
        # ended with "Fatal Python error: bool_dealloc". requirements-new-gui.txt excludes that build; this names the
        # defect in seconds if another build brings it back.
        shell: bash
        timeout-minutes: 5
        env:
          PROBE_QUICK: "1"
        run: python -X faulthandler tests/ci_bool_refcount_probe.py
      - name: Run unit tests (full suite, one process)
        shell: bash
        timeout-minutes: 60
        run: |
          set +e
          python -X faulthandler tests/ci_run_suite.py --trace refcount-trace.jsonl 2>&1 | tee test-results.txt
          code=${PIPESTATUS[0]}
          set -e
          python tests/ci_summary.py test-results.txt --group "Linux full suite" --exit-code "$code" \
            --min-tests 4000 --refcounts refcount-trace.jsonl
      - name: Check that the new interface Qt tests run offscreen (none skipped)
        if: always()
        shell: bash
        timeout-minutes: 15
        run: |
          set +e
          python -X faulthandler -m unittest discover -s tests -p "test_new_gui1_qt.py" -v 2>&1 | tee qt-test-results.txt
          code=${PIPESTATUS[0]}
          set -e
          python tests/ci_summary.py qt-test-results.txt --group "NEW-GUI.1 Qt tests" --exit-code "$code" \
            --min-tests 18 --no-skips
      - name: Run M11 R6.5 research synthetic tests (no real data)
        if: always()
        shell: bash
        timeout-minutes: 15
        run: |
          set +e
          python -X faulthandler -m unittest discover -s research/m11_r65 -v 2>&1 | tee research-test-results.txt
          code=${PIPESTATUS[0]}
          set -e
          python tests/ci_summary.py research-test-results.txt --group "M11 R6.5 research tests" --exit-code "$code"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-${{ matrix.python }}
          path: |
            test-results.txt
            refcount-trace.jsonl
            qt-test-results.txt
            research-test-results.txt
            installed-packages.txt

  windows-supervisor:
    name: windows (Win32 Job Object supervision, native)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      NEW_GUI_REQUIRE_QT: "1"
      PYTHONFAULTHANDLER: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-new-gui.txt
          python -m pip freeze | tee installed-packages.txt
      - name: Supervised solid runner (no skip accepted)
        shell: bash
        timeout-minutes: 20
        run: |
          set +e
          python -X faulthandler -m unittest discover -s tests -p "test_solid_forward_runner.py" -v 2>&1 | tee windows-runner-results.txt
          code=${PIPESTATUS[0]}
          set -e
          python tests/ci_summary.py windows-runner-results.txt --group "Windows supervised runner" --exit-code "$code" \
            --min-tests 24 --no-skips
      - name: Research Tuning solid page with the real supervisor (no skip accepted)
        if: always()
        shell: bash
        timeout-minutes: 20
        run: |
          set +e
          python -X faulthandler -m unittest discover -s tests -p "test_research_tuning_solid_gui.py" -v 2>&1 | tee windows-gui-results.txt
          code=${PIPESTATUS[0]}
          set -e
          python tests/ci_summary.py windows-gui-results.txt --group "Windows Research Tuning solid page" --exit-code "$code" \
            --min-tests 16 --no-skips
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-supervisor-test-results
          path: |
            windows-runner-results.txt
            windows-gui-results.txt
            installed-packages.txt
