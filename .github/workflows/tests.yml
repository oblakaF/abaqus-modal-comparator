name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Install the new interface dependency (PySide6, offscreen Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install -r requirements-new-gui.txt
      - name: Run unit tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          NEW_GUI_REQUIRE_QT: "1"
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Check that the new interface Qt tests run offscreen (none skipped)
        if: always()
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          NEW_GUI_REQUIRE_QT: "1"
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_new_gui1_qt.py" 2>&1 | tee qt-test-results.txt
          ran=$(grep -oE '^Ran [0-9]+ test' qt-test-results.txt | grep -oE '[0-9]+')
          echo "::notice title=NEW-GUI.1 Qt tests::Ran ${ran} Qt tests offscreen; result line: $(grep -E '^(OK|FAILED)' qt-test-results.txt)"
          test "${ran:-0}" -ge 18
          grep -qxE 'OK' qt-test-results.txt  # plain OK: no test skipped
      - name: Run M11 R6.5 research synthetic tests (no real data)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s research/m11_r65 -v 2>&1 | tee research-test-results.txt
          count=$(grep -oE '^Ran [0-9]+ test' research-test-results.txt | grep -oE '[0-9]+')
          skipped=$(grep -cE '\.\.\. skipped' research-test-results.txt || true)
          echo "::notice title=M11 R6.5 research tests::Ran ${count} research tests (${skipped} skipped on this platform)"
          test "${count:-0}" -gt 0
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: |
            test-results.txt
            qt-test-results.txt
            research-test-results.txt
